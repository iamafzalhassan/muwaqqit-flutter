name: muwaqqit
description: "Muwaqqit"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  flutter_bloc: ^9.1.1
  adhan: ^2.0.0
  geolocator: ^13.0.1
  hijri: ^3.0.1
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: GoogleSansRegular
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
    - family: ProductSansThin
      fonts:
        - asset: assets/fonts/ProductSans-Thin.ttf